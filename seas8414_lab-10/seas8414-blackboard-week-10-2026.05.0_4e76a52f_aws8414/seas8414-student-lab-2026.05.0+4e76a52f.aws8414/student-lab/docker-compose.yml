# Breakwater IoT Simulation Lab — Student Edition
#
# Usage:
#   docker compose up -d       # Start all containers
#   ./wait-for-lab.sh          # Wait for health checks
#   ./check-lab.sh             # Validate release-safe runtime settings
#   docker compose logs -f     # Watch logs
#   docker compose down -v     # Stop and clean up
#
# Network: 172.30.0.0/24 (iotsim-net)
# API exposed on http://127.0.0.1:${BREAKWATER_LAB_API_PORT:-8100}

networks:
  iotsim-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata-iotsim: {}

x-lab-runtime: &lab-runtime
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-simulator: &simulator-base
  <<: *lab-runtime
  # Public, immutable simulator manifest-list digest verified for anonymous pulls.
  image: ${BREAKWATER_LAB_SIMULATOR_IMAGE:-ghcr.io/gwuml/breakwater-lab-simulator@sha256:fc81d8e7bcdc3a91d7a4f594843f79e2d4c02bf59481dd1ac8a1ef1c4d6da790}
  restart: unless-stopped
  user: "1000:1000"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  cap_drop:
    - ALL
  cap_add:
    - NET_BIND_SERVICE
  pids_limit: 128
  mem_limit: 256m
  healthcheck:
    test: ["CMD-SHELL", "pgrep -f simulator.py || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 10s
  volumes:
    - ./profiles:/profiles:ro

services:
  # ==========================================================================
  # Infrastructure
  # ==========================================================================

  redis:
    <<: *lab-runtime
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    user: "999:1000"
    read_only: true
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    networks:
      iotsim-net:
        ipv4_address: 172.30.0.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    <<: *lab-runtime
    image: postgres:15@sha256:67dc02dae6e27fa8b4333df9bfdf15265b33ce04186cd7e65c0b8fe67ee37b97
    restart: unless-stopped
    environment:
      POSTGRES_USER: breakwater
      POSTGRES_PASSWORD: "${BREAKWATER_LAB_DB_PASSWORD:-breakwater-lab-dev-only}"
      POSTGRES_DB: breakwater
    volumes:
      - pgdata-iotsim:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 256
    mem_limit: 512m
    networks:
      iotsim-net:
        ipv4_address: 172.30.0.3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breakwater"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    <<: *lab-runtime
    # Public, immutable API manifest-list digest verified for anonymous pulls.
    image: ${BREAKWATER_LAB_API_IMAGE:-ghcr.io/gwuml/breakwater-lab-api@sha256:d4fa2a71277020ed3ca2599e49e009a2cb8c53512050ab98bc5d71e279873163}
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    ports:
      - "${BREAKWATER_LAB_BIND_ADDR:-127.0.0.1}:${BREAKWATER_LAB_API_PORT:-8100}:8000"
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    pids_limit: 512
    mem_limit: 2g
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      iotsim-net:
        ipv4_address: 172.30.0.4
    environment:
      DATABASE_URL: "postgresql+asyncpg://breakwater:${BREAKWATER_LAB_DB_PASSWORD:-breakwater-lab-dev-only}@postgres:5432/breakwater"
      BREAKWATER_REDIS_URL: "redis://redis:6379/0"
      JWT_ACCESS_SECRET: "${BREAKWATER_LAB_JWT_ACCESS_SECRET:-change-me-public-student-lab-access-only}"
      JWT_REFRESH_SECRET: "${BREAKWATER_LAB_JWT_REFRESH_SECRET:-change-me-public-student-lab-refresh-only}"
      BREAKWATER_SCAN_TOPOLOGY: "local"
      BREAKWATER_ARP_ENABLED: "false"
      BREAKWATER_DHCP_ROUTER_ENABLED: "false"
      BREAKWATER_DNS_REVERSE_ENABLED: "false"
      BREAKWATER_MDNS_ENABLED: "true"
      BREAKWATER_SSDP_ENABLED: "true"
      BREAKWATER_CVE_LOOKUP_ENABLED: "true"
      BREAKWATER_NUCLEI_ENABLED: "true"
      BREAKWATER_NUCLEI_TAGS: "iot,default-login,misconfiguration,exposure"
      BREAKWATER_NUCLEI_SEVERITY: "medium,high,critical"
      BREAKWATER_NUCLEI_TIMEOUT: "300"
      BREAKWATER_NUCLEI_RATE_LIMIT: "50"
      BREAKWATER_DEFAULT_CREDS_ENABLED: "true"
      BREAKWATER_ADMIN_EMAILS: '["student@example.com","seas8414-aws-trial@example.com"]'
      BREAKWATER_FIRMWARE_ENABLED: "true"
      BREAKWATER_SBOM_ENABLED: "true"
      BREAKWATER_INTEGRITY_CHECKS_ENABLED: "true"
      BREAKWATER_PROTOCOL_ENGINE_ENABLED: "true"
      BREAKWATER_ATTACK_GRAPH_ENABLED: "true"
      BREAKWATER_PENTEST_ENABLED: "true"
      BREAKWATER_PENTEST_SAFETY_MODE: "simulation"
      BREAKWATER_DIGITAL_TWIN_ENABLED: "true"
      BREAKWATER_QUANTUM_READINESS_ENABLED: "true"
      BREAKWATER_FEDERATED_INTEL_ENABLED: "true"
      BREAKWATER_SUPPLY_CHAIN_ENABLED: "true"
      BREAKWATER_DECEPTION_ENABLED: "true"
      BREAKWATER_FORMAL_VERIFY_ENABLED: "true"
      BREAKWATER_REMEDIATION_ENABLED: "true"
      BREAKWATER_REMEDIATION_AUTO_EXECUTE: "false"
      BREAKWATER_REMEDIATION_APPROVAL_MODE: "manual"
      BREAKWATER_REMEDIATION_SELF_HEALING_ENABLED: "false"
      BREAKWATER_RETENTION_CLEANUP_ENABLED: "false"

  # ==========================================================================
  # Cameras (172.30.0.10-15)
  # ==========================================================================

  hikvision-camera:
    <<: *simulator-base
    hostname: iotsim-hikvision-camera
    mac_address: "c0:56:e3:00:00:01"
    environment:
      DEVICE_PROFILE: /profiles/hikvision-camera.json
    networks:
      iotsim-net:
        ipv4_address: 172.30.0.10

  dahua-nvr:
