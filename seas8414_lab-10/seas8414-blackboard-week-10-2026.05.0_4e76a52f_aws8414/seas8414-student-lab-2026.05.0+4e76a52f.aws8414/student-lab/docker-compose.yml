  # ==========================================================================
  # IoT Protocols (172.30.0.50-52)
  # ==========================================================================

  mqtt-broker:
    <<: *lab-runtime
    image: eclipse-mosquitto:2@sha256:a908c65cc8e67ec9d292ef27c2c0360dbaaee7eb1b935cdd194e67697f15dea1
    hostname: iotsim-mqtt-broker
    restart: unless-stopped
    user: "1883:1883"
    read_only: true
    tmpfs:
      - /mosquitto/data:rw,noexec,nosuid,size=16m,mode=1777
      - /mosquitto/log:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      iotsim-net:
        ipv4_address: 172.30.0.50

  raspberry-pi:
